_id: revenant
datasworn_version: "0.1.0"
type: ruleset
truths:
  timeline:
    name: Timeline
    type: truth
    _source:
      <<: &Source
        title: 'Revenant'
        license: https://creativecommons.org/licenses/by-sa/4.0
        url: https://www.drivethrurpg.com/en/product/457762/revenant
        date: 2025-06-23
        authors:
          - name: Killian Gillespie
      page: 25
    options:
      - roll: { min: 1, max: 20 }
        summary: The Denial
        description: |-
          The majority of people choose not to acknowledge the threat.

          The first cases of the Revenant pathogen reanimating the dead are appearing. The news stories are presented with a comical tone and report on far away locations. Even if the cases were in the same city, the same neighbourhood, people either don't believe it is true or think it could never happen to them; that it could never come to their homes.

          The voices of a minority of people who have seen the Revenant pathogens' effects first hand are lost in the crowd. Misinformation spreads as people choose the safety of lies over the uncomfortable truth.
        quest_starter: ""
      - roll: { min: 21, max: 40 }
        summary: The Uprising
        description: |-
          The threat becomes undeniable; attempts are made to stop it.

          The Revenant pathogen is undeniable; its presence unavoidable. People need to take active precautions to ensure they remain safe. Violent crimes become more frequent and the severity of the crime means that any occurrences of attacks from the undead are harder to track. Without that valuable data the government is unable to create targeted efforts to contain the Revenant pathogen.
        quest_starter: ""
      - roll: { min: 41, max: 60 }
        summary: The Fall
        description: |-
          The threat is unable to be contained or eliminated and society falls.

          An increase in extremism in the militia groups and a lack of response from law enforcement causes the perceived need for vigilantism. Rioting ensues and allows quarantine escapees to flee en masse. Between the smuggling, quarantine boundaries failing, and evacuations, the mass migration causes the Revenant pathogen to be impossible to contain.
        quest_starter: ""
      - roll: { min: 61, max: 80 }
        summary: The Ash
        description: |-
          The world burns as the threat overwhelms civilisation as we know it.

          If the dawn of mankind is when we first harnessed the power of fire then the Ash was when we lost that control. Infernos spread unchecked in cities across the world as the chaos reigned. Where we held control we burned our dead by the thousands in pyres made from their homes.
        quest_starter: ""
      - roll: { min: 81, max: 100 }
        summary: Post-Ash
        description: |-
          When the skies cleared the survivors of the Ash found a changed world.

          They needed to adapt, or die. Contrary to popular belief, people band together during and after disasters. It's a natural response to a threat. We are stronger in numbers. We even have a response similar to pain from a physical injury if we are excluded because we know that to be exluded from the safety of a group means to be left to die.
        quest_starter: ""
  radiation:
    name: Radiation
    type: truth
    _source:
      <<: *Source
      page: 177
    options:
      - roll: { min: 1, max: 33 }
        summary: Radiation is not a threat.
        description: |-
          The environment is not exposed to significant levels of radiation outside old power plants.

          The __Radiation__ condition meter is not used.
        quest_starter: ""
      - roll: { min: 34, max: 67 }
        summary: Radiation is a localized threat.
        description: |-
          A large amount of power plants eventually succumbed to a meltdown and nuclear weapons degraded exposing their core. Nature is exposed to high radioactive levels in large surroundings of those facilities.

          The __Radiation__ condition meter is used.
        quest_starter: |-
          A nearby power plant is close to a meltdown, and only specialized [Technicians](datasworn:npc:revenant/humanity/technician) are able to prevent it.
      - roll: { min: 68, max: 100 }
        summary: Radiation is everywhere
        description: |-
          In hopes to contain the virus, large areas were bombed with nuclear weapons. Various levels of radiation could be in any place.

          The __Radiation__ condition meter is used.
        quest_starter: |-
          Radiation poisoning in your enclave, save them.
  vectors:
    name: Vectors
    type: truth
    _source:
      <<: *Source
      page: 228
    options:
      - roll: { min: 1, max: 25 }
        summary: No vectors
        description: |-
          No optional rule regarding vectors is in place.
        quest_starter: ""
      - roll: { min: 26, max: 50 }
        summary: Just a scratch
        description: |-
          When you [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten) and miss, roll your action die. You only [Face Death](datasworn:move:revenant/suffer/face_death) if the action die is a 1.
        quest_starter: ""
      - roll: { min: 51, max: 75 }
        summary: Infectious
        description: |-
          When you [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten), count a weak hit as a miss.
        quest_starter: ""
      - roll: { min: 76, max: 100 }
        summary: Black Fever
        description: |-
          When you [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten) and miss, start a scene challenge. This scene challenge will determine how you attempt to overcome the black fever. Only [Face Death](datasworn:move:revenant/suffer/face_death) if you [Finish the Scene](datasworn:move:revenant/scene_challenge/finish_the_scene) and miss.
        quest_starter: ""
  mutants:
    name: Mutants
    type: truth
    _source:
      <<: *Source
      page: 230
    options:
      - roll: { min: 1, max: 33 }
        summary: There's no such things as Hulks, Screamers, or Sables.
        description: |-
          [The Undead](datasworn:npc_collection:revenant/the_undead) are your garden variety of roaming, dull rotten flesh.
        quest_starter: ""
      - roll: { min: 34, max: 67 }
        summary: Rumors of mutated zombies exist and some claim to have encountered them.
        description: |-
          Everyone has heard rumors or fabled stories of encounters with som super strong [Undead](datasworn:npc_collection:revenant/the_undead), but you have yet to see one for yourself.
        quest_starter: |-
          A scavenger returns to your enclave all shaken, swearing to have encountered a [Hulk](datasworn:npc:revenant/the_undead/hulk) nearby. See what's up with that.
      - roll: { min: 68, max: 100 }
        summary: Zombies exist in all varieties.
        description: |-
          [The Undead](datasworn:npc_collection:revenant/the_undead) come in every form and mutation imaginable.
        quest_starter: |-
          The warden of a partner enclave is asks you for help to look into one of their members. There is a suspicion that a sable-host infected them.
  immunity:
    name: Immunity
    type: truth
    _source:
      <<: *Source
      page: 230
    options:
      - roll: { min: 1, max: 33 }
        summary: No one is immune
        description: |-
          Immunity is not something humanity is hoping for.
        quest_starter: ""
      - roll: { min: 34, max: 67 }
        summary: Immunity is a possibility
        description: |-
          There is hope, and you may hear rumors of immune people, or actually even encounter immune people.

          When you encounter an NPC you may choose for them to be immune to the Revenant pathogen. However, they are hunted by a power or authority. If your encounter leads to creating a progress track involving them (plan, bond, exploration), associate a Nemesis (see page 103) with that track and [Advance a Nemesis](datasworn:move:revenant/plan/advance_a_nemesis) accordingly.
        quest_starter: |-
          A member of a friendly commune asks you for help to smuggle a potentially immune person into safety.
      - roll: { min: 68, max: 100 }
        summary: You are immune
        description: |-
          When you create a new character you may choose for them to be immune to the Revenant pathogen. If you need to [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten), consider it an automatic strong hit.

          However, you are now hunted by a power or authority. Create a four segment tension clock on your character sheet. When you make a move, you may improve the result to a strong hit. If you do, fill one segment of the clock to represent hunters closing in. When the clock is filled, a notable foe or force has tracked you down. If you overcome them or escape, reset the clock and mark 1 tick on your plans legacy track.
        quest_starter: |-
          Someone witnessed you getting bit without any consequences. What are they going to do with that information?
  carriers:
    name: Carriers
    type: truth
    _source:
      <<: *Source
      page: 256
    options:
      - roll: { min: 1, max: 25 }
        summary: No carriers
        description: |-
          No optional rule regarding carriers is in place.
        quest_starter: ""
      - roll: { min: 26, max: 50 }
        summary: In darkness they feast
        description: |-
          When you [Undertake an Expedition](datasworn:move:revenant/exploration/undertake_an_expedition) or [Journey](datasworn:move:revenant/exploration/journey) and roll a 1 on your action die, start a scene challenge as you try to survive the night.
        quest_starter: ""
      - roll: { min: 51, max: 75 }
        summary: Oh, Rats
        description: |-
          If you [Endure Harm](datasworn:move:revenant/suffer/endure_harm) from a rat, mark the __wounded__ impact.
        quest_starter: ""
      - roll: { min: 76, max: 100 }
        summary: Like the plague
        description: |-
          Rats are capable of transmitting the Revenant pathogen. You must [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten) when fighting rats.
        quest_starter: ""
