_id: revenant
datasworn_version: "0.1.0"
type: ruleset
truths:
  timeline:
    name: Timeline
    type: truth
    _source:
      <<: &Source
        title: 'Revenant'
        license: https://creativecommons.org/licenses/by-sa/4.0
        url: https://www.drivethrurpg.com/en/product/457762/revenant
        date: 2025-06-23
        authors:
          - name: Killian Gillespie
      page: 25
    options:
      - roll: { min: 1, max: 20 }
        summary: The Denial
        description: |-
          The majority of people choose not to acknowledge the threat.

          The first cases of the Revenant pathogen reanimating the dead are appearing. The news stories are presented with a comical tone and report on far away locations. Even if the cases were in the same city, the same neighbourhood, people either don't believe it is true or think it could never happen to them; that it could never come to their homes.

          The voices of a minority of people who have seen the Revenant pathogens' effects first hand are lost in the crowd. Misinformation spreads as people choose the safety of lies over the uncomfortable truth.
        quest_starter: ""
      - roll: { min: 21, max: 40 }
        summary: The Uprising
        description: |-
          The threat becomes undeniable; attempts are made to stop it.

          The Revenant pathogen is undeniable; its presence unavoidable. People need to take active precautions to ensure they remain safe. Violent crimes become more frequent and the severity of the crime means that any occurrences of attacks from the undead are harder to track. Without that valuable data the government is unable to create targeted efforts to contain the Revenant pathogen.
        quest_starter: ""
      - roll: { min: 41, max: 60 }
        summary: The Fall
        description: |-
          The threat is unable to be contained or eliminated and society falls.

          An increase in extremism in the militia groups and a lack of response from law enforcement causes the perceived need for vigilantism. Rioting ensues and allows quarantine escapees to flee en masse. Between the smuggling, quarantine boundaries failing, and evacuations, the mass migration causes the Revenant pathogen to be impossible to contain.
        quest_starter: ""
      - roll: { min: 61, max: 80 }
        summary: The Ash
        description: |-
          The world burns as the threat overwhelms civilisation as we know it.

          If the dawn of mankind is when we first harnessed the power of fire then the Ash was when we lost that control. Infernos spread unchecked in cities across the world as the chaos reigned. Where we held control we burned our dead by the thousands in pyres made from their homes.
        quest_starter: ""
      - roll: { min: 81, max: 100 }
        summary: Post-Ash
        description: |-
          When the skies cleared the survivors of the Ash found a changed world.

          They needed to adapt, or die. Contrary to popular belief, people band together during and after disasters. It's a natural response to a threat. We are stronger in numbers. We even have a response similar to pain from a physical injury if we are excluded because we know that to be exluded from the safety of a group means to be left to die.
        quest_starter: ""
  radiation:
    name: Radiation
    type: truth
    _source:
      <<: *Source
      page: 177
    options:
      - roll: { min: 1, max: 50 }
        summary: Radiation is not a threat
        description: |-
          The __Radiation__ condition meter is not used.
        quest_starter: ""
      - roll: { min: 51, max: 100 }
        summary: Radiation is a threat
        description: |-
          The __Radiation__ condition meter is used.
        quest_starter: |-
          A nearby power plant is close to a meltdown, and only specialized [Technicians](datasworn:npc:revenant/humanity/technician) are able to prevent it.
      - roll: { min: 68, max: 100 }
        summary: Radiation is everywhere
        description: |-
          In hopes to contain the virus, large areas were bombed with nuclear weapons. Various levels of radiation could be in any place.

          The __Radiation__ condition meter is used.
        quest_starter: |-
          Radiation poisoning in your enclave, save them.
  mutants:
    name: Mutants
    type: truth
    _source:
      <<: *Source
      page: 223
    options:
      - roll: { min: 1, max: 33 }
        summary: Humans only
        description: |-
          There are no undead or any of their variety.
        quest_starter: ""
      - roll: { min: 34, max: 67 }
        summary: Zombies
        description: |-
          Zombies exist but they never mutated to anything further.
        quest_starter: ""
      - roll: { min: 68, max: 100 }
        summary: Zombies and mutants
        description: |-
          When you create a new character you may choose for them to be immune to the Revenant pathogen. If you need to [Avoid Being Bitten](datasworn:move:revenant/combat/avoid_being_bitten), consider it an automatic strong hit.

          However, you are now hunted by a power or authority. Create a four segment tension clock on your character sheet. When you make a move, you may improve the result to a strong hit. If you do, fill one segment of the clock to represent hunters closing in. When the clock is filled, a notable foe or force has tracked you down. If you overcome them or escape, reset the clock and mark 1 tick on your plans legacy track.
        quest_starter: |-
          Someone witnessed you getting bit without any consequences. What are they going to do with that information?