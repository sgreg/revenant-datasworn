_id: revenant
datasworn_version: "0.1.0"
type: ruleset
assets:
  companion:
    type: asset_collection
    _source:
      <<: &Source
        title: 'Revenant'
        license: https://creativecommons.org/licenses/by-sa/4.0
        url: https://www.drivethrurpg.com/en/product/457762/revenant
        date: 2025-06-23
        authors:
          - name: Killian Gillespie
      page: 113
    name: Companion Assets
    description: |-
      When an NPC joins your company they become a companion. Companions have an endurance meter the same way a player character does. When a companion is harmed you make the [Companion Takes a Hit](datasworn:move:revenant/suffer/companion_takes_a_hit) move instead of the [Endure Harm](datasworn:move:revenant/suffer/endure_harm) move.
  
      NPC's can be companions without being a connection and vice versa. You may meet an NPC with whom you interact and they could become a connection or a companion, or both, or neither.
    contents:
      companion:
        name: Companion
        type: asset
        category: Companion
        shared: true
        options:
          name:
            field_type: text
            label: name
        _source:
          <<: *Source
          page: 113
        abilities:
        - enabled: true
          text: |-
            When an NPC accompanies you on your adventures they become a companion.
            
            Companions have an endurance meter. When your companion takes damage, make the [Companion Takes a Hit](datasworn:move:revenant/suffer/companion_takes_a_hit) to determine the outcome. If your companion's endurance is reduced to 0, or was already at 0 and your Companion takes a hit, you must Lose momentum and apply any remaining -endurance to your momentum meter.
            
            When your companion's endurance is at 0 and you score a miss, they are out of action. You cannot leverage their support until they gain at least +1 endurance. If you score a miss with a match, they're dead.
        controls:
          endurance:
            label: endurance
            field_type: condition_meter
            max: 5
            value: 5
            min: 0
            moves:
              suffer:
                - move:revenant/suffer/companion_takes_a_hit
              recover:
                - move:revenant/recover/heal
            controls:
              out_of_action:
                label: out of action
                field_type: checkbox
                disables_asset: true